root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/pmx"
  cmd = "go build -o ./tmp/pmx ."
  delay = 200
  exclude_dir = ["assets", "tmp", "vendor", ".devenv", ".direnv"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go"]
  kill_delay = "0s"
  log = "build-errors.log"
  rerun = false
  send_interrupt = true
  stop_on_error = true

[log]
  main_only = false
  time = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[misc]
  clean_on_exit = true
